name: lists
services:
  db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lists_database}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    env_file: 
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-lists_database}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: ghcr.io/${GITHUB_USERNAME}/${PROJECT_NAME}-api:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: 
      - ../.env 
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-lists_database}

  web:
    image: ghcr.io/${GITHUB_USERNAME}/${PROJECT_NAME}-web:latest
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: 
      - ../.env

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 60 --cleanup --debug

volumes:
  pgdata: