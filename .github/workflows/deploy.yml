name: Build and Push Docker Images

on:
  push:
    branches:
      - production

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.event.repository.name }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_BASE }}-api:latest
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_BASE }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push WEB
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_BASE }}-web:latest
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_BASE }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max