name: Build and Push Umami Image

on:
  push:
    branches:
      - production
    paths:
      - deploy/umami.Dockerfile
      - .github/workflows/deploy-umami.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.event.repository.name }}

jobs:
  build-umami:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase Registry Path
        run: |
          echo "IMAGE_REPOSITORY=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UMAMI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/umami.Dockerfile
          push: true
          build-args: |
            BASE_PATH=${{ vars.UMAMI_BASE_PATH || '/stats' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_BASE }}-umami:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_BASE }}-umami:${{ github.sha }}
          cache-from: type=gha,scope=umami
          cache-to: type=gha,scope=umami,mode=max
